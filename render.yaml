services:
  - type: web
    name: slooze-backend
    runtime: node
    plan: free
    buildCommand: cd apps/backend && pnpm install && pnpm prisma:generate && pnpm build
    startCommand: cd apps/backend && pnpm prisma:migrate:deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slooze-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PORT
        value: 10000

databases:
  - name: slooze-db
    databaseName: slooze
    user: slooze
    plan: free

